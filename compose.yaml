# -----------------------------------------------------------------------------
# Hope Motion — Local Development (Hot Reload / Watch)
# -----------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base

    image: hope-motion:dev

    init: true
    restart: unless-stopped

    working_dir: /app

    command: >
      sh -c "pnpm install --frozen-lockfile && exec pnpm dev --hostname 0.0.0.0"

    ports:
      - "3000:3000"

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env

        - action: rebuild
          path: package.json

        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  node_modules:
  next_cache:
  pnpm_store: