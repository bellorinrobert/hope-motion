# -----------------------------------------------------------------------------
# Hope Motion — development stack
#   docker compose up -d --build   ->  http://localhost:3000
# -----------------------------------------------------------------------------
services:
  web:
    build:
      context: .
      target: base
    image: hope-motion:dev
    init: true
    restart: unless-stopped
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Polling fallback for file watching on Windows bind mounts.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_GOFUNDME_URL: ${NEXT_PUBLIC_GOFUNDME_URL:-https://www.gofundme.com/f/ayuda-a-andrea-a-volver-a-caminar-sin-muletas}
      NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm

volumes:
  node_modules:
  next_cache:
  pnpm_store:
