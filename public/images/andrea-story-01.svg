<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Fotografía de la historia de Andrea, capítulo uno (imagen de referencia)">
  <defs>
    <linearGradient id="s1Base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe3d3"/>
      <stop offset="55%" stop-color="#e0c7ad"/>
      <stop offset="100%" stop-color="#c08a63"/>
    </linearGradient>
    <radialGradient id="s1Light" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#fff8ec" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff8ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="s1Blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#s1Base)"/>
  <rect width="1200" height="1500" fill="url(#s1Light)"/>

  <g filter="url(#s1Blur)" opacity="0.6">
    <circle cx="880" cy="420" r="240" fill="#d9a441"/>
    <circle cx="260" cy="1120" r="260" fill="#b96a45"/>
  </g>

  <g stroke="#16110d" stroke-opacity="0.14" stroke-width="2" fill="none">
    <circle cx="600" cy="720" r="300"/>
    <circle cx="600" cy="720" r="440"/>
  </g>

  <g fill="#16110d" font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="1360" font-size="64" font-style="italic" fill-opacity="0.82">capítulo uno</text>
    <text x="84" y="1420" font-size="24" letter-spacing="8" fill-opacity="0.5">HOPE MOTION · IMAGEN DE REFERENCIA</text>
  </g>
</svg>
