  </g>

  <g stroke="#16110d" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240 1120 C 420 1040, 520 900, 640 760 C 740 640, 860 560, 1000 520"/>
    <circle cx="240" cy="1120" r="14" fill="#16110d" fill-opacity="0.3" stroke="none"/>
    <circle cx="1000" cy="520" r="14" fill="#16110d" fill-opacity="0.3" stroke="none"/>
  </g>

  <g fill="#16110d" font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="1360" font-size="64" font-style="italic" fill-opacity="0.82">capítulo tres</text>
    <text x="84" y="1420" font-size="24" letter-spacing="8" fill-opacity="0.5">HOPE MOTION · IMAGEN DE REFERENCIA</text>
  </g>
