<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Fotografía de la historia de Andrea, capítulo tres (imagen de referencia)">
  <defs>
    <linearGradient id="s3Base" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#e9e2d2"/>
      <stop offset="50%" stop-color="#b9bda6"/>
      <stop offset="100%" stop-color="#5c6b58"/>
    </linearGradient>
    <radialGradient id="s3Glow" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fbf7f1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fbf7f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="s3Blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#s3Base)"/>
  <rect width="1200" height="1500" fill="url(#s3Glow)"/>

  <g filter="url(#s3Blur)" opacity="0.55">
    <circle cx="820" cy="520" r="230" fill="#d9a441"/>
